<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Royal Guard{% endblock %}</title>
  <style>
    :root {
      --bg: #0b0b0d;
      --card: #17171a;
      --border: #26262b;
      --text: #f2f2f3;
      --text-dim: #a3a3a8;
      --accent: #87CEEB;
      --success: #57A05A;
      --error: #b33a3a;
    }
    * { box-sizing: border-box; }
    body {
      background: radial-gradient(circle at top, #14141a 0%, #0b0b0d 60%);
      color: var(--text);
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 48px 40px;
      text-align: center;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .crest {
      width: 56px;
      height: 56px;
      margin-bottom: 16px;
      opacity: 0.9;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 1.5rem;
      letter-spacing: 0.02em;
    }
    p {
      color: var(--text-dim);
      line-height: 1.5;
      margin: 0 0 8px;
    }
    .username {
      color: var(--text);
      font-weight: 600;
    }
    .badge {
      display: inline-block;
      background: rgba(135, 206, 235, 0.12);
      color: var(--accent);
      border: 1px solid rgba(135, 206, 235, 0.3);
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .success-icon, .error-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 1.6rem;
    }
    .success-icon { background: rgba(87, 160, 90, 0.15); color: var(--success); }
    .error-icon { background: rgba(179, 58, 58, 0.15); color: var(--error); }
    .footer-note {
      margin-top: 28px;
      font-size: 0.8rem;
      color: #5c5c62;
    }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
